<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>万圣夜主题投票</title>
<meta name="description" content="万圣夜变装派对：看海报，投出今年的主题。">
<meta property="og:title" content="万圣夜主题投票 · Halloween Theme Vote">
<meta property="og:description" content="看海报，投出今年的变装主题。">
<meta property="og:image" content="posters/odyssey.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #0f0d12;
    --night-2: #19161e;
    --line: #322d39;
    --pumpkin: #f08a24;
    --pumpkin-pale: #ffc98a;
    --ink: #2e1602;
    --bone: #f1e9dc;
    --ash: #9c94a0;
    --good: #7ddc6a;
    --serif: "Noto Serif SC", "Songti SC", serif;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --latin: "Cinzel", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); }
  body {
    color: var(--bone);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    padding: env(safe-area-inset-top, 0px) 16px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  button, input { font: inherit; }

  header { padding-block: 40px 20px; display: grid; gap: 12px; }
  .eyebrow { font-family: var(--latin); letter-spacing: .28em; font-size: 12px; color: var(--pumpkin); text-transform: uppercase; }
  h1 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: clamp(32px, 6vw, 56px); line-height: 1.12; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--pumpkin); }
  .lede { margin: 0; color: var(--ash); max-width: 40em; font-size: 16px; }
  .lede b { color: var(--bone); font-weight: 500; }

  .who {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: var(--night-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-top: 8px;
  }
  .who label { font-weight: 500; }
  .who input {
    flex: 1 1 180px; min-width: 0; background: var(--night); color: var(--bone);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px;
  }
  .who input:focus-visible { outline: 2px solid var(--pumpkin); outline-offset: 1px; }
  .who .hint { flex-basis: 100%; font-size: 13px; color: var(--ash); }
  .notice { border: 1px dashed var(--pumpkin); color: var(--pumpkin-pale); padding: 10px 14px; border-radius: 6px; font-size: 14px; }

  .themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 24px; }
  .theme {
    display: grid; grid-template-rows: auto 1fr; background: var(--night-2);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    transition: border-color .15s;
  }
  .theme.mine { border-color: var(--pumpkin); box-shadow: 0 0 0 1px var(--pumpkin); }
  .poster {
    display: block; width: 100%; padding: 0; border: 0; background: #000; cursor: zoom-in;
    aspect-ratio: 2 / 3; overflow: hidden; position: relative;
  }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster .zoom {
    position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.65); color: #fff;
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
  }
  .poster:focus-visible { outline: 3px solid var(--pumpkin); outline-offset: -3px; }
  .placeholder {
    aspect-ratio: 2 / 3; display: grid; place-items: center; text-align: center; padding: 20px;
    background: repeating-linear-gradient(135deg, var(--night-2) 0 12px, var(--night) 12px 24px);
    color: var(--ash);
  }
  .placeholder span { font-family: var(--latin); font-size: 64px; color: var(--line); display: block; }

  .body { padding: 16px; display: grid; gap: 10px; align-content: start; }
  .name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .name h2 { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 900; }
  .name .en { font-family: var(--latin); font-size: 13px; letter-spacing: .14em; color: var(--pumpkin); text-transform: uppercase; }
  .desc { margin: 0; color: var(--ash); font-size: 14px; }
  .tally { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
  .tally .n { font-family: var(--latin); font-size: 22px; color: var(--pumpkin-pale); min-width: 2ch; }
  .tally .bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .tally .bar i { display: block; height: 100%; background: var(--pumpkin); width: 0; transition: width .4s; }
  .tally .pct { font-size: 13px; color: var(--ash); min-width: 3.5ch; text-align: right; }
  .voters { font-size: 13px; color: var(--ash); min-height: 1.6em; overflow-wrap: anywhere; }
  .vote {
    border: 1px solid var(--pumpkin); background: transparent; color: var(--pumpkin);
    border-radius: 8px; padding: 10px 14px; font-weight: 700; cursor: pointer;
  }
  .vote:hover { background: rgba(240, 138, 36, .12); }
  .vote:focus-visible { outline: 2px solid var(--pumpkin-pale); outline-offset: 2px; }
  .theme.mine .vote { background: var(--pumpkin); color: var(--ink); }
  .vote:disabled { opacity: .45; cursor: not-allowed; }
  .lead-badge { font-size: 12px; font-weight: 700; color: var(--ink); background: var(--pumpkin-pale); padding: 1px 8px; border-radius: 999px; }

  .status { margin-top: 18px; font-size: 13px; color: var(--ash); min-height: 1.6em; }
  footer { margin-top: 36px; font-size: 12px; color: var(--ash); }

  .lightbox {
    position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .92);
    display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    cursor: zoom-out;
  }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lightbox button {
    position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px;
    background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Halloween · 31 Oct · Theme Vote</div>
    <h1>今年万圣夜，<br>我们一起扮<em>哪个主题</em>？</h1>
    <p class="lede">点海报可以放大看角色。<b>每人一票，投完还能改</b>。主题定下来之后，再一起挑各自要扮的角色。</p>
    <div class="who">
      <label for="voter-name">你的名字</label>
      <input id="voter-name" type="text" maxlength="30" autocomplete="nickname" placeholder="例如：Toshiya / 小张">
      <span class="hint">名字会显示在你投的主题下面，方便大家知道谁投了什么。</span>
    </div>
    <div class="notice" id="notice" hidden></div>
  </header>

  <main class="themes" id="themes"></main>
  <div class="status" id="status" aria-live="polite"></div>

  <footer>
    剧照与海报版权归各自片方所有（环球影业、Netflix），仅用于同事间的万圣节主题投票。<br>
    Stills © Universal Pictures, artwork © Netflix. For a private Halloween vote only.
  </footer>
</div>

<div class="lightbox" id="lightbox" hidden>
  <img id="lightbox-img" alt="">
  <button type="button" id="lightbox-close">关闭</button>
</div>

<script>
// ---- 配置：填入 Supabase 项目的 URL 和 anon public key ----
const SUPABASE_URL = "https://wrxchmgpjcabynzhnpig.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_AqG84TJVMP-5NsLCwTS7CA_BYO2ocrr";

const THEMES = [
  { id: "odyssey", name: "奥德赛", en: "The Odyssey", poster: "posters/odyssey.jpg",
    desc: "诺兰 2026 年的史诗电影。英雄、神祇、海怪、求婚者，古希腊造型。" },
  { id: "st", name: "怪奇物语", en: "Stranger Things", poster: "posters/stranger-things.jpg",
    desc: "80 年代霍金斯小镇的孩子们、大人们，还有颠倒世界里的怪物。" },
  { id: "football", name: "足球", en: "Football", poster: null,
    desc: "球星、裁判、守门员，还有万圣夜限定的僵尸前锋。海报准备中。" },
];

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let voterId = store.get("hv-voter");
if (!voterId) {
  voterId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
  store.set("hv-voter", voterId);
}
const nameInput = $("voter-name");
nameInput.value = store.get("hv-name") || "";

const state = { votes: [], mine: null, busy: false, online: !!(SUPABASE_URL && SUPABASE_ANON_KEY) };

// ---- Supabase REST ----
// 旧版 anon key 是 JWT（eyJ 开头），需要同时放进 Authorization；新版 sb_publishable_ key 只放 apikey
const headers = () => ({
  apikey: SUPABASE_ANON_KEY,
  ...(SUPABASE_ANON_KEY.startsWith("eyJ") ? { Authorization: "Bearer " + SUPABASE_ANON_KEY } : {}),
  "Content-Type": "application/json",
});
async function loadVotes() {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/theme_votes?select=voter_id,name,theme,updated_at&order=updated_at.asc`, { headers: headers() });
  if (!r.ok) throw new Error("load " + r.status);
  return r.json();
}
async function saveVote(theme, name) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/theme_votes?on_conflict=voter_id`, {
    method: "POST",
    headers: { ...headers(), Prefer: "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify({ voter_id: voterId, name, theme, updated_at: new Date().toISOString() }),
  });
  if (!r.ok) throw new Error("save " + r.status);
}

// ---- 渲染 ----
function render() {
  const counts = Object.fromEntries(THEMES.map(t => [t.id, []]));
  for (const v of state.votes) if (counts[v.theme]) counts[v.theme].push(v.name);
  const total = state.votes.filter(v => counts[v.theme]).length;
  const max = Math.max(0, ...Object.values(counts).map(a => a.length));
  const box = $("themes");
  box.replaceChildren();
  for (const t of THEMES) {
    const names = counts[t.id];
    const el = document.createElement("article");
    el.className = "theme" + (state.mine === t.id ? " mine" : "");
    const pct = total ? Math.round(names.length / total * 100) : 0;
    el.innerHTML = `
      ${t.poster
        ? `<button class="poster" type="button" aria-label="放大查看海报"><img loading="lazy" alt=""><span class="zoom">点我放大</span></button>`
        : `<div class="placeholder"><div><span>?</span>海报准备中</div></div>`}
      <div class="body">
        <div class="name"><h2></h2><span class="en"></span>${names.length && names.length === max ? `<span class="lead-badge">目前领先</span>` : ""}</div>
        <p class="desc"></p>
        <div class="tally"><span class="n">${names.length}</span><span class="bar"><i style="width:${max ? names.length / max * 100 : 0}%"></i></span><span class="pct">${pct}%</span></div>
        <div class="voters"></div>
        <button class="vote" type="button"></button>
      </div>`;
    el.querySelector("h2").textContent = t.name;
    el.querySelector(".en").textContent = t.en;
    el.querySelector(".desc").textContent = t.desc;
    el.querySelector(".voters").textContent = names.length ? names.join("、") : "还没有人投";
    if (t.poster) {
      el.querySelector("img").src = t.poster;
      el.querySelector(".poster").addEventListener("click", () => openLightbox(t.poster, t.name));
    }
    const btn = el.querySelector(".vote");
    btn.textContent = state.mine === t.id ? "✓ 我投了这个" : "投这个";
    btn.disabled = state.busy;
    btn.addEventListener("click", () => vote(t.id));
    box.append(el);
  }
}

async function vote(themeId) {
  const name = nameInput.value.trim();
  if (!name) {
    setStatus("先在上面填一下你的名字，再投票。");
    nameInput.focus();
    return;
  }
  if (state.mine === themeId) return;
  store.set("hv-name", name);
  const prev = state.mine;
  state.mine = themeId;
  state.votes = state.votes.filter(v => v.voter_id !== voterId).concat({ voter_id: voterId, name, theme: themeId });
  state.busy = true;
  render();
  if (!state.online) {
    state.busy = false;
    setStatus("预览模式：这一票只在你的手机上，还没有连上投票数据库。");
    render();
    return;
  }
  try {
    await saveVote(themeId, name);
    setStatus(prev ? "已改票。" : "投票成功，谢谢！");
    await refresh();
  } catch (e) {
    state.mine = prev;
    setStatus("没投成功，网络可能不稳，请再点一次。");
    await refresh();
  } finally {
    state.busy = false;
    render();
  }
}

async function refresh() {
  if (!state.online) return;
  try {
    state.votes = await loadVotes();
    const me = state.votes.find(v => v.voter_id === voterId);
    state.mine = me ? me.theme : null;
    if (me && !nameInput.value) nameInput.value = me.name;
    render();
  } catch {
    setStatus("暂时读不到最新票数，稍后会自动重试。");
  }
}

function setStatus(msg) { $("status").textContent = msg; }

nameInput.addEventListener("change", async () => {
  const name = nameInput.value.trim();
  store.set("hv-name", name);
  if (name && state.mine && state.online) {
    try { await saveVote(state.mine, name); setStatus("名字已更新。"); refresh(); } catch {}
  }
});

// ---- 海报放大 ----
function openLightbox(src, alt) {
  $("lightbox-img").src = src;
  $("lightbox-img").alt = alt + " 海报";
  $("lightbox").hidden = false;
  $("lightbox-close").focus();
}
function closeLightbox() { $("lightbox").hidden = true; }
$("lightbox").addEventListener("click", closeLightbox);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });

if (!state.online) {
  const n = $("notice");
  n.textContent = "预览模式：还没有连接投票数据库，票数不会保存。";
  n.hidden = false;
}
render();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
