<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>万圣夜主题投票</title>
<meta name="description" content="万圣夜变装派对邀请：打开卡片，投出今年的主题。">
<meta property="og:title" content="万圣夜邀请函 · Halloween Night">
<meta property="og:description" content="打开卡片，投出今年的变装主题。">
<meta property="og:image" content="posters/odyssey.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Creepster&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
  :root {
    color-scheme: dark;
    --sky: #110b1a;
    --sky-2: #1c1229;
    --plum: #2a1638;
    --line: #3b2a4a;
    --pumpkin: #f5841f;
    --pumpkin-pale: #ffcb8f;
    --moon: #f6e7c1;
    --ink: #2b1302;
    --bone: #f3ebe0;
    --ash: #a597ae;
    --serif: "Noto Serif SC", "Songti SC", serif;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --latin: "Cinzel", Georgia, serif;
    --spooky: "Creepster", "Cinzel", fantasy;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(circle at 82% 8%, rgba(246, 231, 193, .16) 0, transparent 22%),
      radial-gradient(ellipse at 50% 120%, rgba(245, 132, 31, .18) 0, transparent 55%),
      var(--sky);
    background-attachment: fixed;
    color: var(--bone);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    padding: env(safe-area-inset-top, 0px) 16px calc(32px + env(safe-area-inset-bottom, 0px));
  }
  button, input { font: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* ---------- 第一屏：邀请卡 ---------- */
  .stage { min-height: 100svh; display: grid; place-items: center; padding-block: 24px; }
  .invite {
    position: relative;
    width: min(380px, 100%);
    aspect-ratio: 3 / 4.3;
    border: 0;
    padding: 0;
    cursor: pointer;
    color: var(--bone);
    background: linear-gradient(165deg, var(--plum) 0%, var(--sky-2) 55%, #0c0812 100%);
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6), 0 0 0 1px rgba(245, 132, 31, .5), 0 0 60px rgba(245, 132, 31, .15);
    overflow: hidden;
    transition: transform .35s ease, box-shadow .35s ease;
    animation: float 5s ease-in-out infinite;
  }
  .invite:hover { transform: translateY(-4px) rotate(-.6deg); box-shadow: 0 36px 90px rgba(0, 0, 0, .65), 0 0 0 1px var(--pumpkin), 0 0 80px rgba(245, 132, 31, .25); }
  .invite:focus-visible { outline: 3px solid var(--pumpkin-pale); outline-offset: 6px; }
  .invite.opening { animation: open .7s cubic-bezier(.6, -.2, .4, 1) forwards; }
  @keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  @keyframes open {
    40% { transform: scale(1.04) rotate(1deg); }
    100% { transform: scale(.6) rotateY(80deg); opacity: 0; }
  }
  .invite svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .invite .frame { position: absolute; inset: 12px; border: 1px solid rgba(245, 132, 31, .45); border-radius: 12px; pointer-events: none; }
  .invite .frame::after { content: ""; position: absolute; inset: 5px; border: 1px dashed rgba(245, 132, 31, .25); border-radius: 9px; }
  .invite .text {
    position: absolute; left: 0; right: 0; bottom: 9%;
    display: grid; justify-items: center; gap: 4px; text-align: center; padding-inline: 28px;
  }
  .invite .hw { font-family: var(--spooky); font-size: 46px; line-height: 1; color: var(--pumpkin); letter-spacing: .04em; text-shadow: 0 0 18px rgba(245, 132, 31, .45); }
  .invite .zh { font-family: var(--serif); font-weight: 900; font-size: 40px; line-height: 1.15; letter-spacing: .12em; }
  .invite .tagline { font-family: var(--latin); font-size: 13px; letter-spacing: .3em; color: var(--pumpkin-pale); }
  .invite .sub { font-size: 14px; color: var(--ash); margin-top: 6px; }
  .invite .tap {
    margin-top: 14px; display: inline-flex; gap: 8px; align-items: center;
    background: var(--pumpkin); color: var(--ink); font-weight: 700; font-size: 14px;
    padding: 8px 18px; border-radius: 999px;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(245, 132, 31, .55); } 50% { box-shadow: 0 0 0 10px rgba(245, 132, 31, 0); } }

  /* ---------- 第二屏：主题选择 ---------- */
  .pick-head { padding-block: 36px 12px; display: grid; gap: 10px; }
  .eyebrow { font-family: var(--latin); letter-spacing: .28em; font-size: 12px; color: var(--pumpkin); text-transform: uppercase; }
  h1 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: clamp(30px, 5.5vw, 48px); line-height: 1.15; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--pumpkin); }
  .lede { margin: 0; color: var(--ash); max-width: 40em; }
  .lede b { color: var(--bone); font-weight: 500; }
  .who {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: rgba(28, 18, 41, .8); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-top: 6px;
  }
  .who label { font-weight: 500; }
  .who input {
    flex: 1 1 180px; min-width: 0; background: var(--sky); color: var(--bone);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px;
  }
  .who input:focus-visible { outline: 2px solid var(--pumpkin); outline-offset: 1px; }
  .mine-banner {
    display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    border: 1px solid var(--pumpkin); background: rgba(245, 132, 31, .1); border-radius: 10px; padding: 12px 16px;
  }
  .mine-banner b { color: var(--pumpkin-pale); }
  .mine-banner .count { color: var(--ash); font-size: 13px; }

  .themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 22px; }
  .theme {
    display: grid; grid-template-rows: auto 1fr; background: var(--sky-2);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    transition: transform .2s, border-color .2s;
    animation: rise .5s ease both;
  }
  .theme:nth-child(2) { animation-delay: .08s; }
  .theme:nth-child(3) { animation-delay: .16s; }
  .theme:nth-child(4) { animation-delay: .24s; }
  @keyframes rise { from { opacity: .001; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .theme:hover { transform: translateY(-3px); border-color: rgba(245, 132, 31, .6); }
  .theme.mine { border-color: var(--pumpkin); box-shadow: 0 0 0 1px var(--pumpkin), 0 0 30px rgba(245, 132, 31, .2); }
  .poster { display: block; width: 100%; padding: 0; border: 0; background: #000; cursor: zoom-in; aspect-ratio: 2 / 3; overflow: hidden; position: relative; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster .zoom { position: absolute; right: 10px; bottom: 10px; background: rgba(0, 0, 0, .65); color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .poster:focus-visible { outline: 3px solid var(--pumpkin); outline-offset: -3px; }
  .placeholder {
    aspect-ratio: 2 / 3; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--ash);
    background: repeating-linear-gradient(135deg, var(--sky-2) 0 12px, var(--sky) 12px 24px);
  }
  .placeholder span { font-family: var(--spooky); font-size: 72px; color: var(--line); display: block; line-height: 1; }
  .body { padding: 16px; display: grid; gap: 10px; align-content: start; }
  .name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .name h2 { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 900; }
  .name .en { font-family: var(--latin); font-size: 13px; letter-spacing: .14em; color: var(--pumpkin); text-transform: uppercase; }
  .desc { margin: 0; color: var(--ash); font-size: 14px; }
  .vote { border: 1px solid var(--pumpkin); background: transparent; color: var(--pumpkin); border-radius: 8px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
  .vote:hover { background: rgba(245, 132, 31, .12); }
  .vote:focus-visible { outline: 2px solid var(--pumpkin-pale); outline-offset: 2px; }
  .theme.mine .vote { background: var(--pumpkin); color: var(--ink); }
  .vote:disabled { opacity: .5; cursor: progress; }

  .status { margin-top: 16px; font-size: 14px; color: var(--pumpkin-pale); min-height: 1.6em; }
  footer { margin-top: 36px; font-size: 12px; color: var(--ash); display: grid; gap: 8px; }
  footer a { color: var(--ash); }

  /* ---------- 发起人结果 ---------- */
  .admin { margin-top: 28px; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: rgba(28, 18, 41, .85); display: grid; gap: 12px; }
  .admin h2 { margin: 0; font-family: var(--serif); font-size: 20px; }
  .admin form { display: flex; flex-wrap: wrap; gap: 8px; }
  .admin input { flex: 1 1 180px; min-width: 0; background: var(--sky); color: var(--bone); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
  .admin button { border: 0; background: var(--pumpkin); color: var(--ink); font-weight: 700; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
  .res-row { display: grid; gap: 4px; padding-block: 8px; border-top: 1px solid var(--line); }
  .res-top { display: flex; align-items: center; gap: 10px; }
  .res-top b { min-width: 5em; font-family: var(--serif); }
  .res-top .bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .res-top .bar i { display: block; height: 100%; background: var(--pumpkin); }
  .res-top .n { font-family: var(--latin); color: var(--pumpkin-pale); min-width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; }
  .res-names { font-size: 13px; color: var(--ash); overflow-wrap: anywhere; }

  .lightbox {
    position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .92);
    display: grid; place-items: center; cursor: zoom-out;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lightbox button { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; background: rgba(255, 255, 255, .15); color: #fff; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- 第一屏：邀请卡 -->
<section class="stage" id="stage">
  <button class="invite" id="invite" type="button" aria-label="打开万圣夜邀请卡，开始选择主题">
    <svg class="scene" viewBox="0 0 380 545" aria-hidden="true">
      <defs>
        <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#f6e7c1" stop-opacity=".55"/>

      </defs>
      <!-- 星星 -->
      <g fill="#f6e7c1" opacity=".7">
        <circle cx="44" cy="70" r="1.4"/><circle cx="96" cy="40" r="1"/><circle cx="160" cy="92" r="1.2"/>

      <!-- 蝙蝠 -->
      <g fill="#110b1a">

        <path transform="translate(70 40) scale(.7)" d="M206 122 q8 -10 16 -2 q4 -8 8 0 q4 -8 8 0 q8 -8 16 2 q-10 -2 -14 6 q-4 -4 -10 -4 q-6 0 -10 4 q-4 -8 -14 -6z"/>

      <g stroke="#a597ae" stroke-width="1" fill="none" opacity=".55">

      <g fill="#110b1a" stroke="#a597ae" stroke-width="1">
        <circle cx="64" cy="156" r="6"/><circle cx="64" cy="147" r="3.5"/>
        <path d="M58 152 l-7 -5 M58 156 l-8 0 M58 160 l-7 5 M70 152 l7 -5 M70 156 l8 0 M70 160 l7 5" fill="none"/>
      </g>
      <!-- 远山与枯树 -->
      <path d="M0 330 Q60 296 120 318 T240 306 T380 316 V545 H0Z" fill="#160e22"/>

        <path d="M30 330 L33 252 L41 252 L40 330Z"/>
        <path d="M33 278 L18 258 L21 256 L35 272Z M38 268 L54 248 L57 251 L40 276Z"/>
      </g>
      <!-- 南瓜灯 -->
      <g transform="translate(322 468) scale(.62)">
        <ellipse cx="0" cy="30" rx="44" ry="32" fill="#f5841f"/>
        <ellipse cx="-20" cy="30" rx="22" ry="30" fill="#e2701a"/>
        <ellipse cx="20" cy="30" rx="22" ry="30" fill="#e2701a"/>
        <ellipse cx="0" cy="30" rx="16" ry="32" fill="#f5841f"/>
        <path d="M-4 -2 q2 -10 10 -12 l2 4 q-6 2 -6 10z" fill="#4a7a2a"/>
        <path d="M-24 20 l10 -8 l6 10z M24 20 l-10 -8 l-6 10z" fill="#2b1302"/>
        <path d="M-26 38 q26 22 52 0 l-6 2 l-4 6 l-6 -5 l-6 6 l-6 -6 l-6 6 l-6 -6 l-4 3z" fill="#2b1302"/>

      <g transform="translate(58 488) scale(.42)">
        <ellipse cx="0" cy="30" rx="44" ry="32" fill="#f5841f"/>

    </svg>
    <span class="frame" aria-hidden="true"></span>
    <span class="text">
      <span class="hw">Halloween</span>
      <span class="zh">万圣夜</span>
      <span class="tagline">COSTUME PARTY</span>
      <span class="sub">今年扮什么？由你来投</span>
      <span class="tap">点击开启 ▸</span>
    </span>
  </button>
</section>

<!-- 第二屏：主题选择 -->
<div class="wrap" id="picker" hidden>
  <header class="pick-head">
    <div class="eyebrow">Halloween · Theme Vote</div>
    <h1>选一个你最想扮的<em>主题</em></h1>
    <p class="lede">点海报可以放大看角色。<b>每人一票，投完还能改</b>。大家的选择互相看不到，结果由发起人统一公布。</p>
    <div class="who">
      <label for="voter-name">你的名字</label>
      <input id="voter-name" type="text" maxlength="30" autocomplete="nickname" placeholder="例如：Toshiya / 小张">
    </div>
    <div class="mine-banner" id="mine-banner" hidden></div>
  </header>

  <main class="themes" id="themes"></main>
  <div class="status" id="status" aria-live="polite"></div>

  <section class="admin" id="admin" hidden>
    <h2>发起人查看结果</h2>
    <form id="admin-form">
      <input id="admin-pass" type="password" autocomplete="current-password" placeholder="输入口令" aria-label="发起人口令">
      <button type="submit">查看</button>
    </form>
    <div id="admin-out"></div>
  </section>

  <footer>
    <span>剧照与海报版权归各自片方所有（环球影业、Netflix），仅用于同事间的万圣节主题投票。Stills © Universal Pictures, artwork © Netflix.</span>
    <span><a href="#admin" id="admin-link">发起人入口</a></span>
  </footer>
</div>

<div class="lightbox" id="lightbox" hidden>
  <img id="lightbox-img" alt="">
  <button type="button" id="lightbox-close">关闭</button>
</div>

<script>
const SUPABASE_URL = "https://wrxchmgpjcabynzhnpig.supabase.co";
const SUPABASE_KEY = "sb_publishable_AqG84TJVMP-5NsLCwTS7CA_BYO2ocrr";

const THEMES = [
  { id: "odyssey", name: "奥德赛", en: "The Odyssey", poster: "posters/odyssey.jpg",
    desc: "诺兰 2026 年的史诗电影。英雄、神祇、海怪、求婚者，古希腊造型。" },
  { id: "st", name: "怪奇物语", en: "Stranger Things", poster: "posters/stranger-things.jpg",
    desc: "80 年代霍金斯小镇的孩子们、大人们，还有颠倒世界里的怪物。" },
  { id: "football", name: "足球", en: "Football", poster: null,
    desc: "球星、裁判、守门员，还有万圣夜限定的僵尸前锋。海报准备中。" },
];
const THEME = Object.fromEntries(THEMES.map(t => [t.id, t]));

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let voterId = store.get("hv-voter");
if (!voterId) {
  voterId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  store.set("hv-voter", voterId);
}
const nameInput = $("voter-name");
nameInput.value = store.get("hv-name") || "";
const state = { mine: store.get("hv-theme"), busy: false, count: null };

// ---- 数据库：只通过函数投票、计数、查结果，网页读不到别人的选择 ----
async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args || {}),
  });
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch {}
  if (!r.ok) { const e = new Error((data && data.message) || ("HTTP " + r.status)); e.status = r.status; throw e; }
  return data;
}

// ---- 邀请卡 → 主题选择 ----
function showPicker(animate) {
  const card = $("invite");
  const go = () => {
    $("stage").hidden = true;
    $("picker").hidden = false;
    window.scrollTo(0, 0);
    if (location.hash === "#admin") $("admin").hidden = false;
    renderThemes();
    refreshCount();
  };
  if (animate && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    card.classList.add("opening");
    setTimeout(go, 650);
  } else go();
}
$("invite").addEventListener("click", () => showPicker(true));
if (location.hash === "#vote" || location.hash === "#admin") showPicker(false);

// ---- 主题卡 ----
function renderThemes() {
  const box = $("themes");
  box.replaceChildren();
  for (const t of THEMES) {
    const el = document.createElement("article");
    el.className = "theme" + (state.mine === t.id ? " mine" : "");
    el.innerHTML = `
      ${t.poster
        ? `<button class="poster" type="button" aria-label="放大查看海报"><img loading="lazy" alt=""><span class="zoom">点我放大</span></button>`
        : `<div class="placeholder"><div><span>?</span>海报准备中</div></div>`}
      <div class="body">
        <div class="name"><h2></h2><span class="en"></span></div>
        <p class="desc"></p>
        <button class="vote" type="button"></button>
      </div>`;
    el.querySelector("h2").textContent = t.name;
    el.querySelector(".en").textContent = t.en;
    el.querySelector(".desc").textContent = t.desc;
    if (t.poster) {
      el.querySelector("img").src = t.poster;
      el.querySelector(".poster").addEventListener("click", () => openLightbox(t.poster, t.name));
    }
    const btn = el.querySelector(".vote");
    btn.textContent = state.mine === t.id ? "✓ 我选了这个" : "选这个";
    btn.disabled = state.busy;
    btn.addEventListener("click", () => vote(t.id));
    box.append(el);
  }
  renderBanner();
}

function renderBanner() {
  const b = $("mine-banner");
  b.replaceChildren();
  if (state.mine && THEME[state.mine]) {
    const s = document.createElement("span");
    s.append("你选了：");
    const strong = document.createElement("b");
    strong.textContent = THEME[state.mine].name;
    s.append(strong, "（可以随时改）");
    b.append(s);
  }
  if (state.count != null) {
    const c = document.createElement("span");
    c.className = "count";
    c.textContent = `已有 ${state.count} 人参与投票`;
    b.append(c);
  }
  b.hidden = !b.childNodes.length;
}

async function vote(themeId) {
  const name = nameInput.value.trim();
  if (!name) {
    setStatus("先在上面填一下你的名字，再选主题。");
    nameInput.focus();
    return;
  }
  if (state.mine === themeId) return;
  store.set("hv-name", name);
  const prev = state.mine;
  state.mine = themeId;
  state.busy = true;
  renderThemes();
  try {
    await rpc("cast_vote", { p_voter: voterId, p_name: name, p_theme: themeId });
    store.set("hv-theme", themeId);
    setStatus(prev ? `已改成「${THEME[themeId].name}」。` : `投票成功：「${THEME[themeId].name}」。谢谢！`);
    refreshCount();
  } catch (e) {
    state.mine = prev;
    setStatus("没投成功，网络可能不稳，请再点一次。");
  } finally {
    state.busy = false;
    renderThemes();
  }
}

async function refreshCount() {
  try { state.count = await rpc("vote_count"); } catch { state.count = null; }
  renderBanner();
}

nameInput.addEventListener("change", async () => {
  const name = nameInput.value.trim();
  store.set("hv-name", name);
  if (name && state.mine) {
    try { await rpc("cast_vote", { p_voter: voterId, p_name: name, p_theme: state.mine }); setStatus("名字已更新。"); } catch {}
  }
});

function setStatus(msg) { $("status").textContent = msg; }

// ---- 发起人结果 ----
$("admin-link").addEventListener("click", () => { $("admin").hidden = false; setTimeout(() => $("admin-pass").focus(), 0); });
$("admin-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const out = $("admin-out");
  out.textContent = "读取中…";
  try {
    const rows = await rpc("vote_results", { p_passcode: $("admin-pass").value });
    const groups = Object.fromEntries(THEMES.map(t => [t.id, []]));
    for (const r of rows) (groups[r.theme] ||= []).push(r.name);
    const total = rows.length;
    const max = Math.max(1, ...Object.values(groups).map(a => a.length));
    out.replaceChildren();
    const head = document.createElement("div");
    head.textContent = `共 ${total} 人投票`;
    out.append(head);
    for (const [id, names] of Object.entries(groups).sort((a, b) => b[1].length - a[1].length)) {
      const row = document.createElement("div");
      row.className = "res-row";
      row.innerHTML = `<div class="res-top"><b></b><span class="bar"><i style="width:${names.length / max * 100}%"></i></span><span class="n">${names.length} 票 · ${total ? Math.round(names.length / total * 100) : 0}%</span></div><div class="res-names"></div>`;
      row.querySelector("b").textContent = THEME[id] ? THEME[id].name : id;
      row.querySelector(".res-names").textContent = names.length ? names.join("、") : "—";
      out.append(row);
    }
  } catch (err) {
    out.textContent = /passcode/i.test(err.message) ? "口令不对。" : "读取失败，请稍后再试。";
  }
});

// ---- 海报放大 ----
function openLightbox(src, alt) {
  $("lightbox-img").src = src;
  $("lightbox-img").alt = alt + " 海报";
  $("lightbox").hidden = false;
  $("lightbox-close").focus();
}
$("lightbox").addEventListener("click", () => { $("lightbox").hidden = true; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("lightbox").hidden = true; });
</script>
